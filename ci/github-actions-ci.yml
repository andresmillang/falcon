name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: Acceptance suite
        run: |
          python3 -m venv .venv
          .venv/bin/pip install websocket-client
          # chrome-headless-shell for the parity/resource comparison.
          .venv/bin/pip install playwright && .venv/bin/playwright install chromium-headless-shell || true
          bash scripts/run_acceptance.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t falcon:ci .
