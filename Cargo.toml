[package]
name = "falcon"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.16"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "cookies", "gzip", "brotli", "rustls", "http2", "json", "form", "query", "deflate", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
url = "2.5.8"
v8 = "135"
